name: atc-advisor-v0
description: AI Co-Pilot for Air Traffic Controllers — MergeEnv-v0 (BlueSky-Gym). Agent suggests realistic clearances (heading, speed, altitude, takeoff/landing) while managing merging traffic, conflict resolution, and efficiency.
version: 0.1.0
author: Sankalp Setia
license: MIT
entrypoint: atc_advisor_env:ATCAdvisorEnv
tags: [air-traffic-control, atc, safety-critical, rl, openenv]
spec_version: 1
type: space
runtime: fastapi
app: server.app:app
port: 7860
tasks:
	- id: task_easy_safety
		difficulty: easy
		objective: Maintain zero conflicts for light traffic merge operations.
		grader:
			type: deterministic
			source: info.grader_scores.task_easy_safety
	- id: task_medium_efficiency
		difficulty: medium
		objective: Balance safe separation and efficient progression to merge profile.
		grader:
			type: deterministic
			source: info.grader_scores.task_medium_efficiency
	- id: task_hard_phraseology
		difficulty: hard
		objective: Maintain safety under dense traffic while preserving command compliance.
		grader:
			type: deterministic
			source: info.grader_scores.task_hard_phraseology
